databaseChangeLog:
  - changeSet:
      id: 1
      author: BulandaK
      preConditions:
        - not:
            tableExists:
              tableName: accounts
        - onFail: MARK_RAN
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
  - changeSet:
      id: 2
      author: BulandaK
      preConditions:
        - not:
            tableExists:
              tableName: transactions
        - onFail: MARK_RAN
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
  - changeSet:
      id: 3
      author: BulandaK
      changes:
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_transactions_account

  - changeSet:
      id: 4
      author: BulandaK
      changes:
        - createIndex:
            tableName: transactions
            indexName: idx_transactions_account_date
            columns:
              - column:
                  name: account_id
              - column:
                  name: date