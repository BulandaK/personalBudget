server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # <-- To linijka ratująca routing Reacta
    }

    # Opcjonalne: Przekierowanie zapytań do API bezpośrednio przez Nginxa (Reverse Proxy)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}