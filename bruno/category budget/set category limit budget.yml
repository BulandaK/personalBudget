info:
  name: set category limit budget
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/budgets
  body:
    type: json
    data: |-
      {
        "accountId":1,
        "category" :"TRANSPORTATION",
        "limitAmount":"600"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
