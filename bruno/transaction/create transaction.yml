info:
  name: create transaction
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/transactions
  body:
    type: json
    data: |-
      {
        "amount": 150,
        "transactionType": "EXPENSE",
        "category": "TRANSPORTATION",
        "description": "Zakupy spożywcze",
        "date": "2026-06-01T14:30:00",
        "accountId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
