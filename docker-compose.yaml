version: '3.8'
services:
  app:
    build: .
    container_name: 'personal-budget-app'
    depends_on:
      - 'postgres-db'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/personal-budget-db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pass
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    ports:
      - '8080:8080'
    networks:
      - my-network
  postgres-db:
    image: postgres:16-alpine
    container_name: 'postgres-v2'
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'pass'
      POSTGRES_DB: 'personal-budget-db'
    ports:
      - '5431:5432'
    networks:
      - my-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
  pgadmin_service:
    image: dpage/pgadmin4
    container_name: my-pgadmin-v2
    environment:
      PGADMIN_DEFAULT_EMAIL: bulandak@gmail.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "15432:80"
    networks:
      - my-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
  frontend:
    image: nginx:alpine
    container_name: personal_budget_gui
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app
networks:
  my-network:
    driver: bridge

volumes:
  pgadmin-data:
  postgres-data: